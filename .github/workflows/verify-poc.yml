name: Verify PoC

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - build_mode: release
            sanitizer: none
            description: "Release Build"
          - build_mode: debug
            sanitizer: none
            description: "Debug Build with Symbols"
          - build_mode: asan
            sanitizer: address
            description: "AddressSanitizer (Memory Safety)"

    name: ${{ matrix.description }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc g++ make

    - name: Display build configuration
      run: |
        echo "Build Mode: ${{ matrix.build_mode }}"
        echo "Sanitizer: ${{ matrix.sanitizer }}"
        gcc --version
        make --version

    - name: Build library
      run: |
        cd src
        make clean
        case "${{ matrix.build_mode }}" in
          debug)
            make debug
            ;;
          asan)
            make asan
            ;;
          *)
            make release
            ;;
        esac
        ls -lh libvulnerable.a

    - name: Build PoC
      run: |
        cd poc
        gcc -Wall -Wextra -std=c99 \
          ${{ matrix.sanitizer != 'none' && format('-fsanitize={0}', matrix.sanitizer) || '' }} \
          ${{ matrix.build_mode == 'debug' && '-g -O0 -DDEBUG' || '-O2' }} \
          -o exploit exploit.c -L../src -lvulnerable -lm
        ls -lh exploit

    - name: Run PoC Tests
      run: |
        cd poc
        case "${{ matrix.build_mode }}" in
          asan)
            ASAN_OPTIONS="verbosity=2:halt_on_error=1:detect_leaks=0" ./run_poc.sh --asan
            ;;
          debug)
            ./run_poc.sh --debug
            ;;
          *)
            ./run_poc.sh --release
            ;;
        esac
      continue-on-error: ${{ matrix.sanitizer == 'address' }}

    - name: Build Test Suite
      run: |
        cd tests
        gcc -Wall -Wextra -std=c99 \
          ${{ matrix.sanitizer != 'none' && format('-fsanitize={0}', matrix.sanitizer) || '' }} \
          ${{ matrix.build_mode == 'debug' && '-g -O0' || '-O2' }} \
          -o vulnerable vulnerable.c -lm

        gcc -Wall -Wextra -std=c99 \
          ${{ matrix.sanitizer != 'none' && format('-fsanitize={0}', matrix.sanitizer) || '' }} \
          ${{ matrix.build_mode == 'debug' && '-g -O0' || '-O2' }} \
          -o patched patched.c -lm

        ls -lh vulnerable patched

    - name: Run Test Suite
      run: |
        cd tests
        case "${{ matrix.build_mode }}" in
          asan)
            ASAN_OPTIONS="verbosity=0:halt_on_error=1:detect_leaks=0" ./test_runner.sh --asan
            ;;
          debug)
            ./test_runner.sh --debug
            ;;
          *)
            ./test_runner.sh
            ;;
        esac
      continue-on-error: ${{ matrix.sanitizer == 'address' }}

    - name: Memory Safety Report
      if: matrix.sanitizer == 'address'
      run: |
        echo "=== AddressSanitizer Enabled ==="
        echo "If no crashes reported above, vulnerability is contained"
        echo "ASan configuration: verbosity=2:halt_on_error=1"

  code-analysis:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck shellcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem \
          src/ poc/ tests/ analysis/
      continue-on-error: true

    - name: Run shellcheck
      run: |
        shellcheck poc/run_poc.sh tests/test_runner.sh
      continue-on-error: true

  documentation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify documentation
      run: |
        echo "=== Checking Documentation ==="

        for file in README.md VULNERABILITY.md analysis/*.md; do
          if [ -f "$file" ]; then
            echo "✓ Found: $file ($(wc -l < "$file") lines)"
          fi
        done

    - name: Validate markdown
      run: |
        echo "=== Markdown Validation ==="
        for file in *.md analysis/*.md; do
          if [ -f "$file" ]; then
            echo "Validating: $file"
            # Basic markdown structure check
            grep -q "^#" "$file" && echo "  ✓ Has headers"
          fi
        done

  summary:
    needs: [build-and-test, code-analysis, documentation]
    runs-on: ubuntu-latest

    if: always()

    steps:
    - name: Print Summary
      run: |
        echo "=========================================="
        echo "   CI/CD Pipeline Summary"
        echo "=========================================="
        echo ""
        echo "Build & Test Status: ${{ needs.build-and-test.result }}"
        echo "Code Analysis Status: ${{ needs.code-analysis.result }}"
        echo "Documentation Status: ${{ needs.documentation.result }}"
        echo ""
        echo "=========================================="
